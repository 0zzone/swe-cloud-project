apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdf-service
  template:
    metadata:
      labels:
        app: pdf-service
    spec:
      containers:
        - name: pdf-service
          image: matt91320/pdf-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: DATABASE_URL
              value: "postgresql://user:password@postgres-pdf:5402/pdfdb?schema=public"
            - name: PORT
              value: "3002"
