apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pdf-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-pdf
  template:
    metadata:
      labels:
        app: postgres-pdf
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "pdfdb"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pdf-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-pdf
spec:
  selector:
    app: postgres-pdf
  ports:
    - protocol: TCP
      port: 5402
      targetPort: 5432
  type: ClusterIP
