apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /pdf
            pathType: Prefix
            backend:
              service:
                name: pdf-service
                port:
                  number: 80
          - path: /image
            pathType: Prefix
            backend:
              service:
                name: image-service
                port:
                  number: 80
